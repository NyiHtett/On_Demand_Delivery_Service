spring.application.name=demo
# MySQL database connection
# MySQL is running in Docker and is exposed on localhost:3306
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/on_demand_delivery_db

# Application-level MySQL account created by docker-compose.yml
spring.datasource.username=delivery_user
spring.datasource.password=delivery_password

# The MySQL driver is usually detected automatically.
# This line is optional but makes the driver explicit.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep the actual secret in the GOOGLE_MAPS_API_KEY environment variable.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Keep the actual secret in the STRIPE_SECRET_KEY environment variable (or the root .env).
# Without a key, checkout skips Stripe and marks orders paid immediately (local testing only).
stripe.secret-key=${STRIPE_SECRET_KEY:}

# Frontend origin used for Stripe success/cancel redirects.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Robot delivery queue. The first order in a batch waits 5 queue units, each later order
# shortens the window by one unit (minimum 1). One unit is 60 seconds; lower it for demos.
robot.queue-unit-seconds=${ROBOT_QUEUE_UNIT_SECONDS:60}
robot.max-orders=10
robot.max-weight-lbs=200
# Store the robot picks orders up from.
robot.pickup-address=${ROBOT_PICKUP_ADDRESS:150 E San Fernando St, San Jose, CA 95112}
# Simulated drive speed multiplier (1 = real Google Maps durations, 10 = ten times faster).
robot.time-scale=${ROBOT_TIME_SCALE:1}
# Used when there is no Google Maps key to time the route.
robot.fallback-minutes-per-stop=5
