# Docker Compose configuration for the MySQL database
services:

  # Defines the MySQL database service
  mysql:

    # Official MySQL image and version
    image: mysql:8.4

    # Name assigned to the running container
    container_name: on-demand-mysql

    # Initial MySQL configuration
    environment:

      # Administrator password for MySQL
      # Development password only; do not use this in production
      MYSQL_ROOT_PASSWORD: root

      # Database created automatically when the container starts for the first time
      MYSQL_DATABASE: on_demand_delivery_db

      # Regular application user
      # Spring Boot should use this user instead of root
      MYSQL_USER: delivery_user

      # Password for the regular application user
      MYSQL_PASSWORD: delivery_password

    # Connects the computer's port 3306 to the container's port 3306
    ports:
      # Override with MYSQL_HOST_PORT if a local MySQL already uses 3306 (npm run dev does this automatically)
      - "${MYSQL_HOST_PORT:-3306}:3306"

    # Stores database data permanently
    # Data remains even if the container is stopped or recreated
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  backend: 
    build: 
      context: ./backend
    image: delivery_backend
    ports: 
      - "8080:8080"
    environment: 
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/on_demand_delivery_db
      SPRING_DATASOURCE_USERNAME: delivery_user
      SPRING_DATASOURCE_PASSWORD: delivery_password
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      GEOCODIO_API_KEY: ${GEOCODIO_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ROBOT_QUEUE_UNIT_SECONDS: ${ROBOT_QUEUE_UNIT_SECONDS:-60}
      ROBOT_TIME_SCALE: ${ROBOT_TIME_SCALE:-1}
    depends_on: 
      - mysql

  frontend: 
    build:
      context: ./frontend
    image: delivery_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend


# Declares the named Docker volume used above
volumes:
  mysql_data:
